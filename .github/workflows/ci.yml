name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrat OpenAPI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Spectral 6 valide mal les $ref externes de « paths » en OAS 3.1 : on lint le contrat assemblé.
      - run: npx --yes @redocly/cli@1.34.5 bundle openapi/openapi.yaml -o openapi/dist/openapi.bundled.yaml
      - run: npx --yes @stoplight/spectral-cli@6 lint openapi/dist/openapi.bundled.yaml --ruleset openapi/.spectral.yaml

  backend:
    name: Backend (Laravel, MySQL 8.4)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fds_test
          MYSQL_USER: fds
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_DATABASE: fds_test
      DB_USERNAME: fds
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PASSWORD: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, intl, bcmath, gd, zip, pcntl, exif
          coverage: none
      - name: Droits pour les bases de test parallèles
        run: mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON \`fds_test%\`.* TO 'fds'@'%'; FLUSH PRIVILEGES;"
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: php artisan test --parallel --processes=4
      - run: composer audit

  frontend:
    name: Frontend (React, TypeScript)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types API à jour avec le contrat
        run: npm run api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high
