# --------------------------------------------------------------------------- Lot 4 : ventes, facturation, trésorerie
CustomerRef:
  type: object
  required: [id, code, name, phone]
  properties:
    id: { $ref: '#/Ulid' }
    code: { type: string }
    name: { type: string }
    phone: { type: [string, 'null'] }

Customer:
  type: object
  required: [id, code, name, customer_type, phone, email, address, default_price_list_id, payment_terms_days, is_walk_in, status, has_history, created_at]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    code: { type: string }
    name: { type: string }
    customer_type: { type: string, enum: [individual, business] }
    phone: { type: [string, 'null'], description: 'Format E.164 (+221…)' }
    email: { type: [string, 'null'] }
    address: { type: [string, 'null'] }
    default_price_list_id: { type: [string, 'null'] }
    payment_terms_days: { type: [integer, 'null'] }
    is_walk_in: { type: boolean }
    status: { type: string, enum: [active, inactive] }
    has_history: { type: boolean }
    created_at: { $ref: '#/DateTime' }

SalesLine:
  type: object
  required: [id, position, variant, product_type, unit_id, unit_label, unit_factor, description, qty_units, qty_base, list_unit_price, unit_price, price_overridden, discount_type, discount_value, discount_amount, tax_rate_id, tax_rate, tax_amount, line_total]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    position: { type: integer }
    variant:
      oneOf: [{ $ref: '#/VariantRef' }, { type: 'null' }]
    product_type: { type: string, enum: [stock, service] }
    unit_id: { $ref: '#/Ulid' }
    unit_label: { type: string }
    unit_factor: { type: integer }
    description: { type: string }
    qty_units: { type: integer }
    qty_base: { type: integer }
    list_unit_price: { $ref: '#/Decimal' }
    unit_price: { $ref: '#/Decimal' }
    price_overridden: { type: boolean }
    discount_type: { type: [string, 'null'] }
    discount_value: { type: [string, 'null'] }
    discount_amount: { $ref: '#/Decimal' }
    tax_rate_id: { type: [string, 'null'] }
    tax_rate: { type: string }
    tax_amount: { $ref: '#/Decimal' }
    line_total: { $ref: '#/Decimal' }
    qty_delivered: { type: integer }
    qty_returned: { type: integer }
    qty_cancelled: { type: integer }
    estimated_unit_cost: { type: [string, 'null'], description: 'Visible avec products.view_sensitive' }

SalesHeader:
  type: object
  required: [id, number, customer, price_list_id, warehouse_id, currency, global_discount, subtotal, discount_total, tax_total, total, status, notes, version, created_at]
  properties:
    id: { $ref: '#/Ulid' }
    number: { type: string }
    customer:
      oneOf: [{ $ref: '#/CustomerRef' }, { type: 'null' }]
    price_list_id: { $ref: '#/Ulid' }
    warehouse_id: { type: [string, 'null'] }
    currency: { $ref: '#/CurrencyCode' }
    global_discount:
      type: [object, 'null']
      properties:
        type: { type: string }
        value: { type: string }
    subtotal: { $ref: '#/Decimal' }
    discount_total: { $ref: '#/Decimal' }
    tax_total: { $ref: '#/Decimal' }
    total: { $ref: '#/Decimal' }
    status: { type: string }
    notes: { type: [string, 'null'] }
    version: { type: integer }
    created_at: { $ref: '#/DateTime' }
    lines: { type: array, items: { $ref: '#/SalesLine' } }

Quotation:
  allOf:
    - $ref: '#/SalesHeader'
    - type: object
      required: [issue_date, valid_until, converted_order_id]
      properties:
        status: { type: string, enum: [draft, sent, accepted, converted, expired, cancelled] }
        issue_date: { type: string, format: date }
        valid_until: { type: [string, 'null'], format: date }
        converted_order_id: { type: [string, 'null'] }

Dispute:
  type: object
  required: [id, sales_order_id, status, reason, resolution, opened_at, resolved_at]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    sales_order_id: { $ref: '#/Ulid' }
    status: { type: string, enum: [open, resolved] }
    reason: { type: string }
    resolution: { type: [string, 'null'] }
    opened_at: { $ref: '#/DateTime' }
    resolved_at: { type: [string, 'null'], format: date-time }

SalesOrder:
  allOf:
    - $ref: '#/SalesHeader'
    - type: object
      required: [quotation_id, channel, fulfilment_mode, recipient_name, recipient_phone, delivery_address, has_dispute, invoice_id, confirmed_at, cancelled_at, cancellation_reason, parent_order_id]
      properties:
        status: { type: string, enum: [draft, pending_approval, confirmed, preparing, ready, in_delivery, partially_delivered, delivered, cancelled] }
        quotation_id: { type: [string, 'null'] }
        channel: { type: string, enum: [standard, counter] }
        fulfilment_mode: { type: string, enum: [pickup, delivery] }
        recipient_name: { type: [string, 'null'] }
        recipient_phone: { type: [string, 'null'] }
        delivery_address: { type: [string, 'null'] }
        has_dispute: { type: boolean }
        invoice_id: { type: [string, 'null'] }
        confirmed_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancellation_reason: { type: [string, 'null'] }
        parent_order_id: { type: [string, 'null'] }
        invoice:
          type: [object, 'null']
          properties:
            id: { $ref: '#/Ulid' }
            number: { type: string }
            total: { $ref: '#/Decimal' }
            balance_due: { $ref: '#/Decimal' }
            payment_status: { type: string }
            payment_method: { type: [string, 'null'] }
            status: { type: string }
        deliveries: { type: array, items: { $ref: '#/Delivery' } }
        disputes: { type: array, items: { $ref: '#/Dispute' } }

Delivery:
  type: object
  required: [id, number, sales_order_id, warehouse_id, mode, status, recipient_name, recipient_phone, address, courier, prepared_at, shipped_at, delivered_at, failed_at, failure_reason, attempt, version, created_at]
  properties:
    id: { $ref: '#/Ulid' }
    number: { type: string, examples: [BL-2026-0001] }
    sales_order_id: { $ref: '#/Ulid' }
    warehouse_id: { $ref: '#/Ulid' }
    mode: { type: string, enum: [pickup, delivery] }
    status: { type: string, enum: [preparing, ready, in_delivery, delivered, failed, cancelled] }
    recipient_name: { type: [string, 'null'] }
    recipient_phone: { type: [string, 'null'] }
    address: { type: [string, 'null'] }
    courier: { type: [string, 'null'] }
    prepared_at: { type: [string, 'null'], format: date-time }
    shipped_at: { type: [string, 'null'], format: date-time }
    delivered_at: { type: [string, 'null'], format: date-time }
    failed_at: { type: [string, 'null'], format: date-time }
    failure_reason: { type: [string, 'null'] }
    attempt: { type: integer }
    version: { type: integer }
    created_at: { $ref: '#/DateTime' }
    lines:
      type: array
      items:
        type: object
        required: [id, sales_order_line_id, variant, quantity, qty_delivered, lots]
        properties:
          id: { $ref: '#/Ulid' }
          sales_order_line_id: { $ref: '#/Ulid' }
          variant:
            oneOf: [{ $ref: '#/VariantRef' }, { type: 'null' }]
          quantity: { type: integer }
          qty_delivered: { type: integer }
          lots:
            type: array
            items:
              type: object
              required: [lot_id, lot_number, quantity, allocation_method, attempt, status]
              properties:
                lot_id: { $ref: '#/Ulid' }
                lot_number: { type: [string, 'null'] }
                quantity: { type: integer }
                allocation_method: { type: string, enum: [fifo, manual] }
                attempt: { type: integer }
                status: { type: string, enum: [allocated, delivered, returned] }
                unit_cost: { $ref: '#/Decimal' }

SalesReturn:
  type: object
  required: [id, number, sales_order_id, customer_id, warehouse_id, return_type, status, credit_note_id, exchange_order_id, reason, received_at, closed_at, created_at]
  properties:
    id: { $ref: '#/Ulid' }
    number: { type: string, examples: [RET-2026-0001] }
    sales_order_id: { $ref: '#/Ulid' }
    customer_id: { $ref: '#/Ulid' }
    warehouse_id: { $ref: '#/Ulid' }
    return_type: { type: string, enum: [refused, defective, exchange, other] }
    status: { type: string, enum: [draft, received, inspected, closed, cancelled] }
    credit_note_id: { type: [string, 'null'] }
    exchange_order_id: { type: [string, 'null'] }
    reason: { type: [string, 'null'] }
    received_at: { type: [string, 'null'], format: date-time }
    closed_at: { type: [string, 'null'], format: date-time }
    created_at: { $ref: '#/DateTime' }
    lines:
      type: array
      items:
        type: object
        required: [id, sales_order_line_id, variant, lot_id, lot_number, quantity, disposition, credit_amount]
        properties:
          id: { $ref: '#/Ulid' }
          sales_order_line_id: { $ref: '#/Ulid' }
          variant:
            oneOf: [{ $ref: '#/VariantRef' }, { type: 'null' }]
          lot_id: { $ref: '#/Ulid' }
          lot_number: { type: [string, 'null'] }
          quantity: { type: integer }
          disposition: { type: [string, 'null'], enum: [restock, damaged, null] }
          credit_amount: { $ref: '#/Decimal' }

Invoice:
  type: object
  required: [id, number, sales_order_id, customer_id, customer, issue_date, due_date, currency, subtotal, discount_total, tax_total, total, amount_paid, amount_credited, balance_due, payment_method, payment_status, status, is_overdue, created_at]
  properties:
    id: { $ref: '#/Ulid' }
    number: { type: string, examples: [FAC-2026-0001] }
    sales_order_id: { $ref: '#/Ulid' }
    customer_id: { $ref: '#/Ulid' }
    customer:
      type: object
      properties:
        code: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
    issue_date: { type: string, format: date }
    due_date: { type: string, format: date }
    currency: { $ref: '#/CurrencyCode' }
    subtotal: { $ref: '#/Decimal' }
    discount_total: { $ref: '#/Decimal' }
    tax_total: { $ref: '#/Decimal' }
    total: { $ref: '#/Decimal' }
    amount_paid: { $ref: '#/Decimal' }
    amount_credited: { $ref: '#/Decimal' }
    balance_due: { $ref: '#/Decimal' }
    payment_method: { type: [string, 'null'], enum: [cash, wave, orange_money, bank_transfer, null] }
    payment_status: { type: string, enum: [unpaid, partially_paid, paid] }
    status: { type: string, enum: [issued, cancelled] }
    is_overdue: { type: boolean }
    created_at: { $ref: '#/DateTime' }
    customer_snapshot: { type: object }
    company_snapshot: { type: object }
    lines: { type: array, items: { type: object } }
    payments: { type: array, items: { type: object } }
    credit_applications: { type: array, items: { type: object } }

CreditNote:
  type: object
  required: [id, number, customer_id, origin_invoice_id, return_id, kind, reason, currency, total, amount_applied, amount_available, status, issued_at, version, created_at]
  properties:
    id: { $ref: '#/Ulid' }
    number: { type: [string, 'null'], description: 'AV-AAAA-NNNN, attribué à l’émission' }
    customer_id: { $ref: '#/Ulid' }
    origin_invoice_id: { type: [string, 'null'] }
    return_id: { type: [string, 'null'] }
    kind: { type: string, enum: [cancellation, return, commercial, price_correction] }
    reason: { type: string }
    currency: { $ref: '#/CurrencyCode' }
    total: { $ref: '#/Decimal' }
    amount_applied: { $ref: '#/Decimal' }
    amount_available: { $ref: '#/Decimal' }
    status: { type: string, enum: [draft, pending_approval, issued, rejected] }
    issued_at: { type: [string, 'null'], format: date-time }
    version: { type: integer }
    created_at: { $ref: '#/DateTime' }
    lines: { type: array, items: { type: object } }
    applications: { type: array, items: { type: object } }

Payment:
  type: object
  required: [id, number, invoice_id, invoice_number, customer_id, financial_account_id, method, amount, currency, paid_at, external_reference, status, reverses_payment_id, reversal_reason, invoice_balance_due, invoice_payment_status]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    number: { type: string, examples: [REC-2026-0001] }
    invoice_id: { $ref: '#/Ulid' }
    invoice_number: { type: [string, 'null'] }
    customer_id: { $ref: '#/Ulid' }
    financial_account_id: { $ref: '#/Ulid' }
    method: { type: string, enum: [cash, wave, orange_money, bank_transfer] }
    amount: { $ref: '#/Decimal', description: 'Négatif pour une contre-passation' }
    currency: { type: [string, 'null'] }
    paid_at: { $ref: '#/DateTime' }
    external_reference: { type: [string, 'null'] }
    status: { type: string, enum: [posted, reversed] }
    reverses_payment_id: { type: [string, 'null'] }
    reversal_reason: { type: [string, 'null'] }
    invoice_balance_due: { type: [string, 'null'] }
    invoice_payment_status: { type: [string, 'null'] }

FinancialAccount:
  type: object
  required: [id, code, name, account_type, currency, status]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    code: { type: string }
    name: { type: string }
    account_type: { type: string, enum: [cash, wave, orange_money, bank, other] }
