Ulid:
  type: string
  description: Identifiant ULID (alphabet Crockford, majuscules).
  pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
  examples: ['01JCXK8H0V3Q8T1Q4M7R2N5W6Y']

Decimal:
  type: string
  description: Nombre décimal exact transmis en chaîne (jamais en nombre JSON).
  pattern: '^-?\d+(\.\d{1,8})?$'
  examples: ['100000', '33333.33333333']

CurrencyCode:
  type: string
  description: Code devise ISO 4217.
  pattern: '^[A-Z]{3}$'
  examples: ['XOF']

Money:
  type: object
  required: [amount, currency]
  additionalProperties: false
  properties:
    amount:
      $ref: '#/Decimal'
    currency:
      $ref: '#/CurrencyCode'

PaginationMeta:
  type: object
  required: [page, per_page, total, last_page]
  properties:
    page: { type: integer, minimum: 1 }
    per_page: { type: integer, minimum: 1, maximum: 100 }
    total: { type: integer, minimum: 0 }
    last_page: { type: integer, minimum: 1 }

HealthStatus:
  type: object
  required: [status]
  additionalProperties: false
  properties:
    status:
      type: string
      enum: [ok, degraded]

Problem:
  type: object
  required: [type, title, status, code]
  properties:
    type: { type: string, format: uri }
    title: { type: string }
    status: { type: integer }
    code:
      type: string
      description: Code d'erreur stable (docs/05-contrats-api.md §1.6).
      examples: [validation_failed, insufficient_stock, idempotency_conflict]
    detail: { type: string }
    instance: { type: string }
    request_id: { $ref: '#/Ulid' }
    meta:
      type: object
      additionalProperties: true
    errors:
      type: array
      items:
        type: object
        required: [code]
        properties:
          pointer: { type: string }
          code: { type: string }
          message: { type: string }
          meta:
            type: object
            additionalProperties: true

# --- Lot 1 : plateforme, identité, accès -----------------------------------

DateTime:
  type: string
  format: date-time
  examples: ['2026-11-05T10:15:00Z']

CompanySummary:
  type: object
  required: [id, code, trade_name, status, reference_currency, timezone]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    code: { type: string }
    trade_name: { type: string }
    status: { type: string, enum: [provisioning, active, suspended, archived] }
    reference_currency: { $ref: '#/CurrencyCode' }
    timezone: { type: string }

Me:
  type: object
  required: [user, company, permissions]
  additionalProperties: false
  properties:
    user:
      type: object
      required: [id, name, email, is_super_admin, theme]
      additionalProperties: false
      properties:
        id: { $ref: '#/Ulid' }
        name: { type: string }
        email: { type: string, format: email }
        is_super_admin: { type: boolean }
        theme: { $ref: '#/Theme' }
    company:
      description: Entreprise active (null pour un super-admin qui n'en a pas choisi).
      oneOf:
        - { $ref: '#/CompanySummary' }
        - { type: 'null' }
    permissions:
      type: array
      items: { type: string }

Theme:
  type: string
  enum: [system, light, dark]

RoleRef:
  type: object
  required: [id, name]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    name: { type: [string, 'null'] }

User:
  type: object
  required: [id, name, email, phone, status, last_login_at, roles]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    name: { type: string }
    email: { type: string, format: email }
    phone: { type: [string, 'null'] }
    status: { type: string, enum: [invited, active, disabled] }
    last_login_at: { type: [string, 'null'], format: date-time }
    roles:
      type: array
      items: { $ref: '#/RoleRef' }

Invitation:
  type: object
  required: [id, email, role, status, expires_at, created_at]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    email: { type: string, format: email }
    role: { $ref: '#/RoleRef' }
    status: { type: string, enum: [pending, accepted, revoked, expired] }
    expires_at: { $ref: '#/DateTime' }
    created_at: { $ref: '#/DateTime' }

Role:
  type: object
  required: [id, name, is_system, template_code, locked, permissions]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    name: { type: string }
    is_system: { type: boolean }
    template_code: { type: [string, 'null'], enum: [company_admin, seller, storekeeper, accountant, null] }
    locked: { type: boolean, description: 'Rôle Administrateur, non modifiable.' }
    permissions:
      type: array
      items: { type: string }

Permission:
  type: object
  required: [name, module, label, is_sensitive]
  additionalProperties: false
  properties:
    name: { type: string, examples: [users.manage] }
    module: { type: string }
    label: { type: string }
    is_sensitive: { type: boolean }

CompanyIdentity:
  type: object
  properties:
    trade_name: { type: string, minLength: 2, maxLength: 160 }
    legal_name: { type: [string, 'null'], maxLength: 200 }
    ninea: { type: [string, 'null'], maxLength: 32 }
    rccm: { type: [string, 'null'], maxLength: 64 }
    address: { type: [string, 'null'], maxLength: 255 }
    city: { type: [string, 'null'], maxLength: 100 }
    country_code: { type: string, minLength: 2, maxLength: 2 }
    phone: { type: [string, 'null'], maxLength: 32 }
    email: { type: [string, 'null'], format: email, maxLength: 190 }

Company:
  type: object
  required: [id, code, trade_name, legal_name, ninea, rccm, address, city, country_code, phone, email, reference_currency, timezone, status, suspended_at, suspension_reason, created_at]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    code: { type: string }
    trade_name: { type: string }
    legal_name: { type: [string, 'null'] }
    ninea: { type: [string, 'null'] }
    rccm: { type: [string, 'null'] }
    address: { type: [string, 'null'] }
    city: { type: [string, 'null'] }
    country_code: { type: string }
    phone: { type: [string, 'null'] }
    email: { type: [string, 'null'] }
    reference_currency: { $ref: '#/CurrencyCode' }
    timezone: { type: string }
    status: { type: string, enum: [provisioning, active, suspended, archived] }
    suspended_at: { type: [string, 'null'], format: date-time }
    suspension_reason: { type: [string, 'null'] }
    created_at: { $ref: '#/DateTime' }

CompanySettings:
  type: object
  required: [identity, settings]
  additionalProperties: false
  properties:
    identity:
      allOf:
        - { $ref: '#/CompanyIdentity' }
        - type: object
          required: [code, reference_currency]
          properties:
            code: { type: string }
            reference_currency: { $ref: '#/CurrencyCode' }
    settings:
      type: object
      required: [default_payment_terms_days, rounding_mode, low_stock_default_threshold, invoice_legal_mentions, invoice_footer, payment_instructions, start_date, allow_self_approval]
      additionalProperties: false
      properties:
        default_payment_terms_days: { type: integer, minimum: 0, maximum: 365 }
        rounding_mode: { type: string, enum: [half_up] }
        low_stock_default_threshold: { type: integer, minimum: 0 }
        invoice_legal_mentions: { type: [string, 'null'], description: 'Mentions légales — VÉRIF. RÉGL. (VR-01)' }
        invoice_footer: { type: [string, 'null'] }
        payment_instructions: { type: [string, 'null'] }
        start_date: { type: [string, 'null'], format: date }
        allow_self_approval: { type: boolean }

DocumentSequenceFormat:
  type: object
  required: [doc_type, prefix, padding]
  additionalProperties: false
  properties:
    doc_type:
      type: string
      enum: [invoice, credit_note, receipt, quotation, sales_order, delivery, return, purchase_order, supplier_bill, supplier_payment, shipment, goods_receipt, stock_lot, adjustment, inventory, transfer, expense, account_transfer, approval_request]
    prefix: { type: string, pattern: '^[A-Z0-9]{1,12}$' }
    padding: { type: integer, minimum: 1, maximum: 10 }

ExchangeRate:
  type: object
  required: [id, from_currency, to_currency, rate, valid_on, source]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    from_currency: { $ref: '#/CurrencyCode' }
    to_currency: { $ref: '#/CurrencyCode' }
    rate: { $ref: '#/Decimal', description: '1 unité de from_currency = rate unités de to_currency' }
    valid_on: { type: string, format: date }
    source: { type: [string, 'null'] }

TaxRate:
  type: object
  required: [id, name, rate, is_active]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    name: { type: string }
    rate: { $ref: '#/Decimal', description: 'Pourcentage (0 à 100).' }
    is_active: { type: boolean }

AuditLog:
  type: object
  required: [id, company_id, user_id, impersonated_company_id, action, subject_type, subject_id, old_values, new_values, reason, ip_address, request_id, occurred_at]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    company_id: { type: [string, 'null'] }
    user_id: { type: [string, 'null'] }
    impersonated_company_id: { type: [string, 'null'] }
    action: { type: string, examples: [user.updated, auth.login_failed] }
    subject_type: { type: [string, 'null'] }
    subject_id: { type: [string, 'null'] }
    old_values: { type: [object, 'null'] }
    new_values: { type: [object, 'null'] }
    reason: { type: [string, 'null'] }
    ip_address: { type: [string, 'null'] }
    request_id: { type: [string, 'null'] }
    occurred_at: { $ref: '#/DateTime' }

Message:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data:
      type: object
      required: [message]
      properties:
        message: { type: string }

MeEnvelope:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { $ref: '#/Me' }

CompanyEnvelope:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { $ref: '#/Company' }

CompanyList:
  type: object
  required: [data, meta]
  additionalProperties: false
  properties:
    data: { type: array, items: { $ref: '#/Company' } }
    meta: { $ref: '#/PaginationMeta' }

UserEnvelope:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { $ref: '#/User' }

UserList:
  type: object
  required: [data, meta]
  additionalProperties: false
  properties:
    data: { type: array, items: { $ref: '#/User' } }
    meta: { $ref: '#/PaginationMeta' }

InvitationEnvelope:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { $ref: '#/Invitation' }

InvitationList:
  type: object
  required: [data, meta]
  additionalProperties: false
  properties:
    data: { type: array, items: { $ref: '#/Invitation' } }
    meta: { $ref: '#/PaginationMeta' }

RoleEnvelope:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { $ref: '#/Role' }

RoleList:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { type: array, items: { $ref: '#/Role' } }

PermissionList:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { type: array, items: { $ref: '#/Permission' } }

CompanySettingsEnvelope:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { $ref: '#/CompanySettings' }

DocumentSequenceFormatList:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { type: array, items: { $ref: '#/DocumentSequenceFormat' } }

ExchangeRateEnvelope:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { $ref: '#/ExchangeRate' }

ExchangeRateList:
  type: object
  required: [data, meta]
  additionalProperties: false
  properties:
    data: { type: array, items: { $ref: '#/ExchangeRate' } }
    meta: { $ref: '#/PaginationMeta' }

TaxRateEnvelope:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { $ref: '#/TaxRate' }

TaxRateList:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { type: array, items: { $ref: '#/TaxRate' } }

AuditLogList:
  type: object
  required: [data, meta]
  additionalProperties: false
  properties:
    data: { type: array, items: { $ref: '#/AuditLog' } }
    meta: { $ref: '#/PaginationMeta' }

ActiveCompany:
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data:
      type: object
      required: [company]
      properties:
        company:
          oneOf:
            - { $ref: '#/CompanySummary' }
            - { type: 'null' }

# --- Lot 2 : catalogue et stocks ------------------------------------------

Category:
  type: object
  required: [id, parent_id, name, path, is_active]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    parent_id: { type: [string, 'null'] }
    name: { type: string }
    path: { type: string, description: 'Chemin matérialisé /id1/id2/' }
    is_active: { type: boolean }

Attribute:
  type: object
  required: [id, name, values]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    name: { type: string }
    values:
      type: array
      items:
        type: object
        required: [id, value, position]
        additionalProperties: false
        properties:
          id: { $ref: '#/Ulid' }
          value: { type: string }
          position: { type: integer }

VariantUnit:
  type: object
  required: [id, variant_id, code, label, factor, barcode, is_sellable, locked]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    variant_id: { $ref: '#/Ulid' }
    code: { type: string, examples: [piece, carton] }
    label: { type: string }
    factor: { type: integer, minimum: 1, description: "Nombre d'unités de base (pièces)" }
    barcode: { type: [string, 'null'] }
    is_sellable: { type: boolean }
    locked: { type: boolean, description: 'Facteur figé (conditionnement déjà utilisé, CAT-007)' }

ProductVariant:
  type: object
  required: [id, product_id, sku, label, is_default, pieces_per_carton, low_stock_threshold, status, attribute_value_ids, units]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    product_id: { $ref: '#/Ulid' }
    sku: { type: string }
    label: { type: string }
    is_default: { type: boolean }
    pieces_per_carton: { type: [integer, 'null'] }
    low_stock_threshold: { type: [integer, 'null'] }
    status: { type: string, enum: [active, inactive] }
    attribute_value_ids: { type: array, items: { $ref: '#/Ulid' } }
    units: { type: array, items: { $ref: '#/VariantUnit' } }

ProductImage:
  type: object
  required: [id, variant_id, position, url, thumbnail_url]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    variant_id: { type: [string, 'null'] }
    position: { type: integer }
    url: { type: string }
    thumbnail_url: { type: string }

ProductSummary:
  type: object
  required: [id, reference, name, description, category, product_type, base_unit_label, has_variants, status, has_history, version, thumbnail_url]
  properties:
    id: { $ref: '#/Ulid' }
    reference: { type: string }
    name: { type: string }
    description: { type: [string, 'null'] }
    category:
      oneOf:
        - type: object
          required: [id, name]
          properties:
            id: { $ref: '#/Ulid' }
            name: { type: string }
        - { type: 'null' }
    product_type: { type: string, enum: [stock, service] }
    base_unit_label: { type: string }
    has_variants: { type: boolean }
    status: { type: string, enum: [active, inactive, archived] }
    has_history: { type: boolean }
    version: { type: integer }
    thumbnail_url: { type: [string, 'null'] }

Product:
  allOf:
    - $ref: '#/ProductSummary'
    - type: object
      required: [variants, images]
      properties:
        variants: { type: array, items: { $ref: '#/ProductVariant' } }
        images: { type: array, items: { $ref: '#/ProductImage' } }

PriceList:
  type: object
  required: [id, code, name, currency, is_default]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    code: { type: string }
    name: { type: string }
    currency: { $ref: '#/CurrencyCode' }
    is_default: { type: boolean }

ProductPrice:
  type: object
  required: [id, variant_id, price_list_id, unit_id, price, valid_from, valid_to]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    variant_id: { $ref: '#/Ulid' }
    price_list_id: { $ref: '#/Ulid' }
    unit_id: { $ref: '#/Ulid' }
    price: { $ref: '#/Money' }
    valid_from: { type: string, format: date }
    valid_to: { type: [string, 'null'], format: date }

PriceQuote:
  type: object
  required: [price, source, price_list_id, unit_id, factor]
  additionalProperties: false
  properties:
    price: { $ref: '#/Money' }
    source: { type: string, enum: [list, derived], description: 'derived : prix pièce × facteur (CAT-004)' }
    price_list_id: { $ref: '#/Ulid' }
    unit_id: { $ref: '#/Ulid' }
    factor: { type: integer }

VariantRef:
  type: object
  required: [id, product_id, reference, product_name, sku, label]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    product_id: { $ref: '#/Ulid' }
    reference: { type: string }
    product_name: { type: string }
    sku: { type: string }
    label: { type: string }

Warehouse:
  type: object
  required: [id, code, name, address, status, is_default]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    code: { type: string }
    name: { type: string }
    address: { type: [string, 'null'] }
    status: { type: string, enum: [active, inactive] }
    is_default: { type: boolean }

StockPosition:
  type: object
  required: [warehouse_id, variant, on_hand, reserved, blocked, in_delivery, available, expected, in_transit, low_stock_threshold, is_low]
  additionalProperties: false
  description: 'disponible = physique − réservé − bloqué − en livraison (docs/04 §4.1) ; attendu et en transit ne sont jamais vendables.'
  properties:
    warehouse_id: { $ref: '#/Ulid' }
    variant:
      oneOf:
        - { $ref: '#/VariantRef' }
        - { type: 'null' }
    on_hand: { type: integer }
    reserved: { type: integer }
    blocked: { type: integer }
    in_delivery: { type: integer }
    available: { type: integer }
    expected: { type: integer }
    in_transit: { type: integer }
    low_stock_threshold: { type: integer }
    is_low: { type: boolean }

UnitCost:
  type: object
  required: [amount, currency]
  properties:
    amount: { $ref: '#/Decimal' }
    currency: { $ref: '#/CurrencyCode' }

StockLot:
  type: object
  required: [id, lot_number, warehouse_id, variant_id, origin_type, received_at, initial_qty, on_hand, blocked, in_delivery, free, cost_status]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    lot_number: { type: string }
    warehouse_id: { $ref: '#/Ulid' }
    variant_id: { $ref: '#/Ulid' }
    origin_type: { type: string, enum: [receipt, opening, adjustment] }
    received_at: { $ref: '#/DateTime' }
    initial_qty: { type: integer }
    on_hand: { type: integer }
    blocked: { type: integer }
    in_delivery: { type: integer }
    free: { type: integer }
    cost_status: { type: string, enum: [provisional, final] }
    unit_cost: { $ref: '#/UnitCost', description: 'Absent sans products.view_sensitive (GEN-005)' }

StockMovement:
  type: object
  required: [id, warehouse_id, variant_id, lot_id, lot_number, movement_type, quantity, source_type, source_id, reverses_movement_id, reason, occurred_at]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    warehouse_id: { $ref: '#/Ulid' }
    variant_id: { $ref: '#/Ulid' }
    lot_id: { $ref: '#/Ulid' }
    lot_number: { type: string }
    movement_type: { type: string, enum: [receipt, sale_delivery, return_in, transfer_in, transfer_out, adjustment_in, adjustment_out, loss, opening, reversal] }
    quantity: { type: integer, description: 'Signée : + entrée, − sortie' }
    source_type: { type: string }
    source_id: { $ref: '#/Ulid' }
    reverses_movement_id: { type: [string, 'null'] }
    reason: { type: [string, 'null'] }
    occurred_at: { $ref: '#/DateTime' }
    unit_cost: { $ref: '#/UnitCost' }
    total_cost: { $ref: '#/Money' }

RedactedMeta:
  allOf:
    - $ref: '#/PaginationMeta'
    - type: object
      required: [redacted]
      properties:
        redacted: { type: array, items: { type: string }, description: 'Champs masqués faute de permission sensible' }

StockAdjustment:
  type: object
  required: [id, number, warehouse_id, inventory_id, transfer_id, status, reason, posted_at, version, created_at]
  properties:
    id: { $ref: '#/Ulid' }
    number: { type: string, examples: [AJU-2026-0001] }
    warehouse_id: { $ref: '#/Ulid' }
    inventory_id: { type: [string, 'null'] }
    transfer_id: { type: [string, 'null'] }
    status: { type: string, enum: [draft, pending_approval, posted, rejected, cancelled] }
    reason: { type: [string, 'null'] }
    posted_at: { type: [string, 'null'], format: date-time }
    version: { type: integer }
    created_at: { $ref: '#/DateTime' }
    lines:
      type: array
      items:
        type: object
        required: [id, variant, lot_id, lot_number, quantity, kind]
        properties:
          id: { $ref: '#/Ulid' }
          variant: { oneOf: [{ $ref: '#/VariantRef' }, { type: 'null' }] }
          lot_id: { type: [string, 'null'] }
          lot_number: { type: [string, 'null'] }
          quantity: { type: integer }
          kind: { type: string, enum: [gain, loss, damage, correction] }
          unit_cost: { type: [string, 'null'] }

Inventory:
  type: object
  required: [id, number, warehouse_id, scope, variant_ids, status, snapshot_at, validated_at, adjustment_id, note, version, created_at]
  properties:
    id: { $ref: '#/Ulid' }
    number: { type: string }
    warehouse_id: { $ref: '#/Ulid' }
    scope: { type: string, enum: [full, partial] }
    variant_ids: { type: array, items: { $ref: '#/Ulid' } }
    status: { type: string, enum: [draft, counting, review, validated, cancelled] }
    snapshot_at: { type: [string, 'null'], format: date-time }
    validated_at: { type: [string, 'null'], format: date-time }
    adjustment_id: { type: [string, 'null'] }
    note: { type: [string, 'null'] }
    version: { type: integer }
    created_at: { $ref: '#/DateTime' }
    lines:
      type: array
      items:
        type: object
        required: [id, variant, lot_id, lot_number, qty_expected, qty_moved_since_snapshot, qty_counted, difference, counted_at, note]
        properties:
