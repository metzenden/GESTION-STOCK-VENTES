LandedCost:
  type: object
  required: [id, shipment_id, model_id, revision, status, reference_currency, rates_snapshot, inputs_hash, total_cbm, total_common_fees, total_direct_fees, total_purchase, total_cost, blocking_issues, discrepancies, computed_at, finalized_at, created_at]
  additionalProperties: false
  properties:
    id: { $ref: '#/Ulid' }
    shipment_id: { $ref: '#/Ulid' }
    model_id: { $ref: '#/Ulid' }
    revision: { type: integer }
    status: { type: string, enum: [computed, final, superseded] }
    reference_currency: { $ref: '#/CurrencyCode' }
    rates_snapshot: { type: object, description: 'Taux utilisés (CR-003)' }
    inputs_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    total_cbm: { $ref: '#/Volume' }
    total_common_fees: { $ref: '#/Decimal' }
    total_direct_fees: { $ref: '#/Decimal' }
    total_purchase: { $ref: '#/Decimal' }
    total_cost: { $ref: '#/Decimal' }
    blocking_issues:
      type: array
      description: Anomalies bloquant la finalisation (CR-006)
      items:
        type: object
        required: [code, message]
        properties:
          code: { type: string }
          message: { type: string }
    discrepancies: { type: array, items: { type: object }, description: 'Écarts (manquants valorisés, surplus) — CR-010' }
    computed_at: { type: [string, 'null'], format: date-time }
    finalized_at: { type: [string, 'null'], format: date-time }
    created_at: { $ref: '#/DateTime' }
    lines: { type: array, items: { $ref: '#/LandedCostLine' } }
    valuation_adjustments:
      type: array
      items:
        type: object
        required: [id, lot_id, stock_movement_id, movement_type, quantity, old_unit_cost, new_unit_cost, delta_amount]
        properties:
          id: { $ref: '#/Ulid' }
          lot_id: { $ref: '#/Ulid' }
          stock_movement_id: { $ref: '#/Ulid' }
          movement_type: { type: string }
          quantity: { type: integer }
          old_unit_cost: { $ref: '#/Decimal' }
          new_unit_cost: { $ref: '#/Decimal' }
          delta_amount: { $ref: '#/Decimal' }

