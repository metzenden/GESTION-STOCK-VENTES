company:
  get:
    operationId: getCompanySettings
    tags: [Paramètres]
    summary: Identité et paramètres de l'entreprise active
    description: "Identité et paramètres de l'entreprise active."
    responses:
      '200':
        description: Paramètres
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CompanySettingsEnvelope' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  patch:
    operationId: updateCompanySettings
    tags: [Paramètres]
    summary: Modifier l'identité et/ou les paramètres
    description: "Modifier l'identité et/ou les paramètres."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              identity: { $ref: '../components/schemas.yaml#/CompanyIdentity' }
              settings:
                type: object
                properties:
                  default_payment_terms_days: { type: integer, minimum: 0, maximum: 365 }
                  low_stock_default_threshold: { type: integer, minimum: 0 }
                  invoice_legal_mentions: { type: [string, 'null'] }
                  invoice_footer: { type: [string, 'null'] }
                  payment_instructions: { type: [string, 'null'] }
                  start_date: { type: [string, 'null'], format: date }
                  allow_self_approval: { type: boolean }
    responses:
      '200':
        description: Paramètres à jour
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CompanySettingsEnvelope' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '423': { $ref: '../components/responses.yaml#/CompanySuspended' }
sequences:
  get:
    operationId: listDocumentSequenceFormats
    tags: [Paramètres]
    summary: Préfixes et largeurs de numérotation par type de document
    description: "Préfixes et largeurs de numérotation par type de document."
    responses:
      '200':
        description: Formats
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/DocumentSequenceFormatList' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  patch:
    operationId: updateDocumentSequenceFormats
    tags: [Paramètres]
    summary: Modifier préfixes et largeurs (le compteur n'est jamais modifiable)
    description: "Modifier préfixes et largeurs (le compteur n'est jamais modifiable)."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [formats]
            properties:
              formats: { type: array, minItems: 1, items: { $ref: '../components/schemas.yaml#/DocumentSequenceFormat' } }
    responses:
      '200':
        description: Formats à jour
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/DocumentSequenceFormatList' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '423': { $ref: '../components/responses.yaml#/CompanySuspended' }
exchangeRates:
  get:
    operationId: listExchangeRates
    tags: [Paramètres]
    summary: Taux de change datés
    description: "Taux de change datés."
    parameters:
      - $ref: '../components/parameters.yaml#/Page'
      - $ref: '../components/parameters.yaml#/PerPage'
      - { name: 'filter[from_currency]', in: query, schema: { $ref: '../components/schemas.yaml#/CurrencyCode' } }
      - { name: 'filter[to_currency]', in: query, schema: { $ref: '../components/schemas.yaml#/CurrencyCode' } }
    responses:
      '200':
        description: Taux
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ExchangeRateList' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    operationId: createExchangeRate
    tags: [Paramètres]
    summary: Saisir un taux daté (1 from_currency = rate to_currency)
    description: "Saisir un taux daté (1 from_currency = rate to_currency)."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [from_currency, to_currency, rate, valid_on]
            properties:
              from_currency: { $ref: '../components/schemas.yaml#/CurrencyCode' }
              to_currency: { $ref: '../components/schemas.yaml#/CurrencyCode' }
              rate: { $ref: '../components/schemas.yaml#/Decimal' }
              valid_on: { type: string, format: date }
              source: { type: [string, 'null'], maxLength: 64 }
    responses:
      '201':
        description: Taux enregistré
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ExchangeRateEnvelope' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '423': { $ref: '../components/responses.yaml#/CompanySuspended' }
taxRates:
  get:
    operationId: listTaxRates
    tags: [Paramètres]
    summary: Taux de taxe (aucun par défaut, M-01)
    description: "Taux de taxe (aucun par défaut, M-01)."
    responses:
      '200':
        description: Taux de taxe
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/TaxRateList' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    operationId: createTaxRate
    tags: [Paramètres]
    summary: Créer un taux de taxe (à saisir après vérification réglementaire, VR-01)
    description: "Créer un taux de taxe (à saisir après vérification réglementaire, VR-01)."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, rate]
            properties:
              name: { type: string, maxLength: 64 }
              rate: { $ref: '../components/schemas.yaml#/Decimal' }
              is_active: { type: boolean }
    responses:
      '201':
        description: Taux créé
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/TaxRateEnvelope' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '423': { $ref: '../components/responses.yaml#/CompanySuspended' }
taxRate:
  parameters:
    - $ref: '../components/parameters.yaml#/Id'
  patch:
    operationId: updateTaxRate
    tags: [Paramètres]
    summary: Modifier ou désactiver un taux de taxe
    description: "Modifier ou désactiver un taux de taxe."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, maxLength: 64 }
              rate: { $ref: '../components/schemas.yaml#/Decimal' }
              is_active: { type: boolean }
    responses:
      '200':
        description: Taux à jour
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/TaxRateEnvelope' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '422': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '423': { $ref: '../components/responses.yaml#/CompanySuspended' }
auditLogs:
  get:
    operationId: listAuditLogs
    tags: [Audit]
    summary: Journal d'audit de l'entreprise active
    description: "Journal d'audit de l'entreprise active."
    parameters:
      - $ref: '../components/parameters.yaml#/Page'
      - $ref: '../components/parameters.yaml#/PerPage'
      - { name: 'filter[action]', in: query, schema: { type: string } }
      - { name: 'filter[user_id]', in: query, schema: { type: string } }
      - { name: 'filter[subject_id]', in: query, schema: { type: string } }
    responses:
      '200':
        description: Entrées du journal
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/AuditLogList' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
