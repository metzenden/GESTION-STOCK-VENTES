supplier_bills:
  get:
    operationId: listSupplierBills
    tags:
    - Achats
    summary: Engagements fournisseurs (🔒)
    description: Engagements fournisseurs (🔒).
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - name: filter[supplier_id]
      in: query
      schema:
        type: string
    - name: filter[status]
      in: query
      schema:
        type: string
    - name: filter[currency]
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SupplierBillPage
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  post:
    operationId: createSupplierBill
    tags:
    - Achats
    summary: Engagement manuel ou avoir fournisseur (montant négatif)
    description: Engagement manuel ou avoir fournisseur (montant négatif).
    parameters:
    - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              supplier_id:
                $ref: ../components/schemas.yaml#/Ulid
              amount:
                type: string
                pattern: ^-?\d+(\.\d{1,4})?$
              bill_date:
                type: string
                format: date
              due_date:
                type:
                - string
                - 'null'
                format: date
              supplier_invoice_ref:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
            required:
            - supplier_id
            - amount
            - bill_date
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SupplierBillEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
purchase_orders:
  get:
    operationId: listPurchaseOrders
    tags:
    - Achats
    summary: Commandes d'achat
    description: Commandes d'achat.
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - name: filter[status]
      in: query
      schema:
        type: string
    - name: filter[supplier_id]
      in: query
      schema:
        type: string
    - name: filter[q]
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PurchaseOrderPage
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  post:
    operationId: createPurchaseOrder
    tags:
    - Achats
    summary: Créer une commande d'achat (brouillon)
    description: Créer une commande d'achat (brouillon).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              supplier_id:
                $ref: ../components/schemas.yaml#/Ulid
              supplier_reference:
                type:
                - string
                - 'null'
              order_date:
                type:
                - string
                - 'null'
                format: date
              estimated_rate:
                type:
                - string
                - 'null'
              notes:
                type:
                - string
                - 'null'
              lines:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    variant_id:
                      $ref: ../components/schemas.yaml#/Ulid
                    unit_id:
                      type:
                      - string
                      - 'null'
                    qty_units:
                      type: integer
                      minimum: 1
                    unit_price:
                      $ref: ../components/schemas.yaml#/Decimal
                  required:
                  - variant_id
                  - qty_units
                  - unit_price
            required:
            - supplier_id
            - lines
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PurchaseOrderEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
