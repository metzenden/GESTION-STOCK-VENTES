suppliers:
  get:
    operationId: listSuppliers
    tags:
    - Achats
    summary: Fournisseurs
    description: Fournisseurs.
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - name: filter[q]
      in: query
      schema:
        type: string
    - name: filter[supplier_type]
      in: query
      schema:
        type: string
    - name: filter[status]
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SupplierPage
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  post:
    operationId: createSupplier
    tags:
    - Achats
    summary: Créer un fournisseur
    description: Créer un fournisseur.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              supplier_type:
                type: string
                enum:
                - goods
                - forwarder
                - carrier
                - customs
                - other
              country_code:
                type:
                - string
                - 'null'
              currency:
                $ref: ../components/schemas.yaml#/CurrencyCode
              phone:
                type:
                - string
                - 'null'
              email:
                type:
                - string
                - 'null'
              address:
                type:
                - string
                - 'null'
              contact_name:
                type:
                - string
                - 'null'
              notes:
                type:
                - string
                - 'null'
            required:
            - code
            - name
            - currency
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SupplierEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
