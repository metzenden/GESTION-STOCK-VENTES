              name:
                type: string
              supplier_type:
                type: string
                enum:
                - goods
                - forwarder
                - carrier
                - customs
                - other
              country_code:
                type:
                - string
                - 'null'
              currency:
                $ref: ../components/schemas.yaml#/CurrencyCode
              phone:
                type:
                - string
                - 'null'
              email:
                type:
                - string
                - 'null'
              address:
                type:
                - string
                - 'null'
              contact_name:
                type:
                - string
                - 'null'
              notes:
                type:
                - string
                - 'null'
              status:
                type: string
