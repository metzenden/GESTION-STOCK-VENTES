landed_cost_categories:
  get:
    operationId: listLandedCostCategories
    tags:
    - Coûts
    summary: Catégories de frais d'approche
    description: Catégories de frais d'approche.
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/LandedCostCategoryList
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  post:
    operationId: createLandedCostCategory
    tags:
    - Coûts
    summary: Créer une catégorie de frais
    description: Créer une catégorie de frais.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              label:
                type: string
              default_allocation:
                type: string
                enum:
                - cbm
                - direct
            required:
            - code
            - label
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/LandedCostCategoryEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
shipments_id_costs:
  get:
    operationId: listShipmentCosts
    tags:
    - Coûts
    summary: Frais d'approche de l'arrivage (🔒)
    description: Frais d'approche de l'arrivage (🔒).
    parameters:
    - name: shipment
      in: path
      required: true
      schema:
        $ref: ../components/schemas.yaml#/Ulid
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ShipmentCostList
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  post:
    operationId: createShipmentCost
    tags:
    - Coûts
    summary: Ajouter un frais d'approche
    description: Ajouter un frais d'approche.
    parameters:
    - name: shipment
      in: path
      required: true
      schema:
        $ref: ../components/schemas.yaml#/Ulid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              category_id:
                $ref: ../components/schemas.yaml#/Ulid
              supplier_id:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
              currency:
                $ref: ../components/schemas.yaml#/CurrencyCode
              amount:
                $ref: ../components/schemas.yaml#/Decimal
              exchange_rate:
                type: string
              allocation_method:
                type: string
                enum:
                - cbm
                - direct
              target_shipment_line_id:
                type:
                - string
                - 'null'
              is_estimate:
                type: boolean
            required:
            - category_id
            - currency
            - amount
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ShipmentCostEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
