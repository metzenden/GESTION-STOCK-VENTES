products:
  get:
    operationId: listProducts
    tags:
    - Catalogue
    summary: Produits (recherche nom, référence, SKU ou code-barres ; filtres statut et catégorie)
    description: Produits (recherche nom, référence, SKU ou code-barres ; filtres statut et catégorie).
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - $ref: ../components/parameters.yaml#/Search
    - name: filter[status]
      in: query
      schema:
        type: string
        enum:
        - active
        - inactive
        - archived
    - name: filter[category_id]
      in: query
      schema:
        type: string
    - name: sort
      in: query
      schema:
        type: string
        enum:
        - name
        - -name
        - reference
        - -reference
        - -created_at
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProductSummaryPage
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  post:
    operationId: createProduct
    tags:
    - Catalogue
    summary: Créer un produit et ses variantes (variante par défaut si aucune)
    description: Créer un produit et ses variantes (variante par défaut si aucune).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              reference:
                type: string
              name:
                type: string
              description:
                type:
                - string
                - 'null'
              category_id:
                type:
                - string
                - 'null'
              product_type:
                type: string
                enum:
                - stock
                - service
              base_unit_label:
                type: string
              pieces_per_carton:
                type:
                - integer
                - 'null'
              low_stock_threshold:
                type:
                - integer
                - 'null'
              barcode:
                type:
                - string
                - 'null'
              carton_barcode:
                type:
                - string
                - 'null'
              variants:
                type: array
                items:
                  type: object
                  properties:
                    sku:
                      type: string
                    label:
                      type: string
                    attribute_value_ids:
                      type: array
                      items:
                        $ref: ../components/schemas.yaml#/Ulid
                    pieces_per_carton:
                      type:
                      - integer
                      - 'null'
                    low_stock_threshold:
                      type:
                      - integer
                      - 'null'
                    barcode:
                      type:
                      - string
                      - 'null'
                    carton_barcode:
                      type:
                      - string
                      - 'null'
                  required:
                  - sku
            required:
            - reference
            - name
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ProductEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
