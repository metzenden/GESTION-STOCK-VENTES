price_lists:
  get:
    operationId: listPriceLists
    tags:
    - Catalogue
    summary: Grilles tarifaires
    description: Grilles tarifaires.
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PriceListList
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  post:
    operationId: createPriceList
    tags:
    - Catalogue
    summary: Créer une grille tarifaire
    description: Créer une grille tarifaire.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              currency:
                $ref: ../components/schemas.yaml#/CurrencyCode
            required:
            - code
            - name
            - currency
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PriceListEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
price_lists_id:
  patch:
    operationId: updatePriceList
    tags:
    - Catalogue
    summary: Renommer une grille ou la définir par défaut
    description: Renommer une grille ou la définir par défaut.
    parameters:
    - $ref: ../components/parameters.yaml#/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              is_default:
                type: boolean
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PriceListEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
pricing_quote:
  get:
    operationId: quotePrice
    tags:
    - Catalogue
    summary: Prix proposé (CAT-004)
    description: Prix proposé (CAT-004).
    parameters:
    - name: variant_id
      in: query
      required: true
      schema:
        $ref: ../components/schemas.yaml#/Ulid
    - name: unit_id
      in: query
      required: true
      schema:
        $ref: ../components/schemas.yaml#/Ulid
    - name: price_list_id
      in: query
      schema:
        type: string
    - name: date
      in: query
      schema:
        type: string
        format: date
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PriceQuoteEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
