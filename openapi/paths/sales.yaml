customers:
  get:
    operationId: listCustomers
    tags:
    - Ventes
    summary: Clients (recherche nom, code, téléphone)
    description: Clients (recherche nom, code, téléphone).
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - $ref: ../components/parameters.yaml#/Search
    - name: filter[status]
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CustomerPage
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  post:
    operationId: createCustomer
    tags:
    - Ventes
    summary: Créer un client
    description: Créer un client.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type:
                - string
                - 'null'
              name:
                type: string
              customer_type:
                type: string
                enum:
                - individual
                - business
              phone:
                type:
                - string
                - 'null'
              email:
                type:
                - string
                - 'null'
              address:
                type:
                - string
                - 'null'
              default_price_list_id:
                type:
                - string
                - 'null'
              payment_terms_days:
                type:
                - integer
                - 'null'
            required:
            - name
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CustomerEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
