quotations:
  get:
    operationId: listQuotations
    tags:
    - Ventes
    summary: Devis
    description: Devis.
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - name: filter[status]
      in: query
      schema:
        type: string
    - name: filter[customer_id]
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/QuotationPage
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  post:
    operationId: createQuotation
    tags:
    - Ventes
    summary: Créer un devis
    description: Créer un devis.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              customer_id:
                $ref: ../components/schemas.yaml#/Ulid
              price_list_id:
                type:
                - string
                - 'null'
              warehouse_id:
                type:
                - string
                - 'null'
              valid_until:
                type:
                - string
                - 'null'
                format: date
              notes:
                type:
                - string
                - 'null'
              global_discount:
                type:
                - object
                - 'null'
                properties:
                  type:
                    type: string
                    enum:
                    - percent
                    - amount
                  value:
                    type: string
              lines:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    variant_id:
                      $ref: ../components/schemas.yaml#/Ulid
                    unit_id:
                      type:
                      - string
                      - 'null'
                    qty_units:
                      type: integer
                      minimum: 1
                    unit_price:
                      type:
                      - string
                      - 'null'
                    discount_type:
                      type:
                      - string
                      - 'null'
                      enum:
                      - percent
                      - amount
                      - null
                    discount_value:
                      type:
                      - string
                      - 'null'
                    tax_rate_id:
                      type:
                      - string
                      - 'null'
                    description:
                      type:
                      - string
                      - 'null'
                  required:
                  - variant_id
                  - qty_units
            required:
            - customer_id
            - lines
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/QuotationEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
