stock_adjustments:
  get:
    operationId: listStockAdjustments
    tags:
    - Stocks
    summary: Ajustements de stock
    description: Ajustements de stock.
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - name: filter[status]
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/StockAdjustmentPage
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  post:
    operationId: createStockAdjustment
    tags:
    - Stocks
    summary: Créer un ajustement (brouillon)
    description: Créer un ajustement (brouillon).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              warehouse_id:
                $ref: ../components/schemas.yaml#/Ulid
              reason:
                type:
                - string
                - 'null'
              lines:
                type: array
                items:
                  type: object
                  required:
                  - variant_id
                  - quantity
                  properties:
                    variant_id:
                      $ref: ../components/schemas.yaml#/Ulid
                    lot_id:
                      type:
                      - string
                      - 'null'
                    quantity:
                      type: integer
                    kind:
                      type: string
                      enum:
                      - gain
                      - loss
                      - damage
                      - correction
                    unit_cost:
                      type:
                      - string
                      - 'null'
            required:
            - warehouse_id
            - lines
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/StockAdjustmentEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
