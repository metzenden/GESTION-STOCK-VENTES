warehouses:
  get:
    operationId: listWarehouses
    tags:
    - Stocks
    summary: Dépôts
    description: Dépôts.
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WarehouseList
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  post:
    operationId: createWarehouse
    tags:
    - Stocks
    summary: Créer un dépôt
    description: Créer un dépôt.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              address:
                type:
                - string
                - 'null'
              is_default:
                type: boolean
            required:
            - code
            - name
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WarehouseEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
warehouses_id:
  patch:
