      in: path
      required: true
      schema:
        $ref: ../components/schemas.yaml#/Ulid
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ShipmentLineList
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  post:
    operationId: createShipmentLines
    tags:
    - Arrivages
    summary: Ajouter des articles attendus
    description: Ajouter des articles attendus.
    parameters:
    - name: shipment
      in: path
      required: true
      schema:
        $ref: ../components/schemas.yaml#/Ulid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              lines:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    purchase_order_line_id:
                      type:
                      - string
                      - 'null'
                    variant_id:
                      $ref: ../components/schemas.yaml#/Ulid
                    supplier_id:
                      type:
                      - string
                      - 'null'
                    container_id:
                      type:
                      - string
                      - 'null'
                    destination_warehouse_id:
                      $ref: ../components/schemas.yaml#/Ulid
                    cartons:
                      type:
                      - integer
                      - 'null'
                    pieces_per_carton:
                      type:
                      - integer
                      - 'null'
                    qty_expected:
                      type: integer
                      minimum: 1
                    cbm_total:
                      type:
                      - string
                      - 'null'
                    cbm_per_carton:
                      type: string
                      description: 'Converti en volume total : cbm_par_carton × cartons (CR-009)'
                    purchase_currency:
                      $ref: ../components/schemas.yaml#/CurrencyCode
                    purchase_unit_price:
                      $ref: ../components/schemas.yaml#/Decimal
            required:
            - lines
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ShipmentEnvelope
