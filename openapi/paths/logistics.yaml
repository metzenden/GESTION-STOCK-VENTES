shipments:
  get:
    operationId: listShipments
    tags:
    - Arrivages
    summary: Arrivages
    description: Arrivages.
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - name: filter[status]
      in: query
      schema:
        type: string
    - name: filter[q]
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ShipmentPage
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
  post:
    operationId: createShipment
    tags:
    - Arrivages
    summary: Créer un arrivage
    description: Créer un arrivage.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              reference:
                type:
                - string
                - 'null'
              carrier:
                type:
                - string
                - 'null'
              origin_country:
                type:
                - string
                - 'null'
              shipped_at:
                type:
                - string
                - 'null'
                format: date
              eta:
                type:
                - string
                - 'null'
                format: date
              default_warehouse_id:
                type:
                - string
                - 'null'
              notes:
                type:
                - string
                - 'null'
    responses:
      '201':
        description: Succès
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ShipmentEnvelope
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationFailed
      '423':
        $ref: ../components/responses.yaml#/CompanySuspended
