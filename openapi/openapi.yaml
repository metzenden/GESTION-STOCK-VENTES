components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fds_session
      description: Session Sanctum (cookie HttpOnly) ; en-tête X-XSRF-TOKEN requis sur les requêtes d'écriture.
  parameters:
    IdempotencyKey:
      $ref: './components/parameters.yaml#/IdempotencyKey'
  schemas:
    Ulid:
      $ref: './components/schemas.yaml#/Ulid'
    Decimal:
      $ref: './components/schemas.yaml#/Decimal'
    CurrencyCode:
      $ref: './components/schemas.yaml#/CurrencyCode'
    Money:
      $ref: './components/schemas.yaml#/Money'
    PaginationMeta:
      $ref: './components/schemas.yaml#/PaginationMeta'
    Problem:
      $ref: './components/schemas.yaml#/Problem'
  responses:
    Problem:
      description: Erreur normalisée (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
