openapi: 3.1.0
info:
  title: FDS Business API
  version: 0.1.0
  description: |
    API REST de gestion commerciale multi-entreprises (docs/05-contrats-api.md).
    Les montants sont transmis en chaînes décimales ; les erreurs suivent la RFC 9457.
  contact:
    name: FDS Business
servers:
  - url: /api/v1
    description: Même origine que l'application (D-043)
security:
  - sessionCookie: []
tags:
  - name: Supervision
    description: Santé de la plateforme
  - name: Authentification
    description: Connexion, session, mot de passe, invitation
  - name: Plateforme
    description: Administration des entreprises par le super-administrateur
  - name: Utilisateurs
    description: Utilisateurs et invitations de l'entreprise active
  - name: Rôles
    description: Rôles et permissions de l'entreprise active
  - name: Paramètres
    description: Identité, numérotation, taux de change, taxes
  - name: Audit
    description: Journal d'audit
  - name: Catalogue
    description: Catégories, produits, variantes, conditionnements, prix, photos
  - name: Stocks
    description: Dépôts, compartiments, lots, mouvements, ajustements, inventaires, transferts
  - name: Achats
    description: Fournisseurs, commandes d'achat, engagements fournisseurs
  - name: Arrivages
    description: Arrivages, conteneurs, packing lists, réceptions
  - name: Coûts
    description: Frais d'approche, modèles de formules, coûts de revient
  - name: Ventes
    description: Clients, devis, commandes, livraisons, retours, litiges, vente comptoir
  - name: Facturation
    description: Factures, avoirs, règlements, créances
  - name: Trésorerie
    description: Comptes financiers et mouvements
  - name: Approbations
    description: Règles, demandes, décisions, notifications
  - name: Rapports
    description: Tableau de bord, alertes, indicateurs, rapports, recherche, imports

