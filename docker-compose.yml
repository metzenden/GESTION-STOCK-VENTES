name: fds

x-php-common: &php-common
  image: fds-php:${FDS_IMAGE_TAG:-local}
  env_file: .env
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  app:
    <<: *php-common
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${PHP_BUILD_TARGET:-base}
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  queue:
    <<: *php-common
    command: ["php", "artisan", "queue:work", "redis", "--queue=critical,default,imports,pdf,mail", "--tries=3", "--max-time=3600"]
    depends_on:
      app: { condition: service_started }

  scheduler:
    <<: *php-common
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app: { condition: service_started }

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=60s", "--chromium-disable-javascript=true"]
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
