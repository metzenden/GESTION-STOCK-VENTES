server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Laravel ne sert que l'API : toutes les requêtes passent par le contrôleur frontal.
    # La SPA est servie par Caddy (prod) ou Vite (dev). Nginx n'a donc pas besoin du code source.
    location / {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }
}
